# dsh-codefall profile patch layer — insert one loader entry for the plugin
# package. The entry is a normal cordis loader entry (id + package name); the
# browser half is picked up by dsh-client-modules through the package's
# dsh.client declaration, exactly like the shipped ui-* packages.
#
# The boot-time look is NOT configured here. The host half reads
# $DSH_HOME/codefall.json on every index render, because the host does not
# expose third-party settings namespaces and the first frame must be correct
# before any client code (and therefore any settings RPC) can run.
- insert:
    - id: codefall
      name: 'dsh-codefall'
